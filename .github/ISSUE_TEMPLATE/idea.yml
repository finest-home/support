name: Idea
description: Something the app or the integration could do, or do better.
labels: ["idea", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you picture it working. Rough is fine.
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - The app
        - The Finest panel or elsewhere in Home Assistant
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues, and this isn't one of them.
          required: true
